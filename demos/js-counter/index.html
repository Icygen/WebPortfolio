<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Demo | Genrei G. Vargas</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }

      .app {
        width: min(100% - 2rem, 22rem);
        padding: 2rem;
        text-align: center;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1rem;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: #94a3b8;
      }

      .count {
        margin: 0 0 1.5rem;
        font-size: 4rem;
        font-weight: 700;
        line-height: 1;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }

      button {
        min-width: 4.5rem;
        padding: 0.65rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 0.6rem;
        cursor: pointer;
      }

      #decrement {
        background: #ef4444;
        color: #fff;
      }

      #reset {
        background: #475569;
        color: #f8fafc;
      }

      #increment {
        background: #0f766e;
        color: #fff;
      }

      button:hover {
        filter: brightness(1.08);
      }

      .back {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #5eead4;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Simple Counter</h1>
      <p class="count" id="count" aria-live="polite">0</p>
      <div class="actions">
        <button type="button" id="decrement" aria-label="Decrease count">−</button>
        <button type="button" id="reset">Reset</button>
        <button type="button" id="increment" aria-label="Increase count">+</button>
      </div>
      <a class="back" href="https://genreivargas.github.io/WebPortfolio/#projects">← Back to portfolio</a>
    </main>
    <script>
      (function () {
        var count = 0;
        var countEl = document.getElementById("count");

        function render() {
          countEl.textContent = String(count);
        }

        document.getElementById("increment").addEventListener("click", function () {
          count += 1;
          render();
        });

        document.getElementById("decrement").addEventListener("click", function () {
          count -= 1;
          render();
        });

        document.getElementById("reset").addEventListener("click", function () {
          count = 0;
          render();
        });
      })();
    </script>
  </body>
</html>
